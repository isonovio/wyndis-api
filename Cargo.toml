[package]
name = "wyndis-api"
version = "0.1.0"
edition = "2024"
default-run = "wyndis-api"

[features]
obscura-test = []

[[bin]]
name = "obscura-test"
path = "src/bin/obscura_test.rs"
required-features = ["obscura-test"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
governor = "0.10"
obscura = { git = "https://github.com/h4ckf0r0day/obscura", features = ["stealth"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1.1"
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
