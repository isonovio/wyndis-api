[package]
name = "wyndis-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "wyndis-api"

[[bin]]
name = "obscura-test"
path = "src/bin/obscura_test.rs"
required-features = ["obscura-test"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
governor = "0.10"
jiff = { version = "0.2", features = ["serde"] }
moka = { version = "0.12", features = ["future"] }
obscura = { git = "https://github.com/h4ckf0r0day/obscura", features = ["stealth"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2"
tower = { version = "0.5", features = ["util"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"

[features]
obscura-test = []
